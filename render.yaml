# Render Blueprint for the Django API. Values marked "sync: false" are asked for in the dashboard.
services:
  - type: web
    name: shelfready-api
    runtime: python
    plan: free
    region: singapore  # next to the Neon database, close to India
    rootDir: backend
    branch: main
    autoDeployTrigger: commit
    buildCommand: bash build.sh
    # One worker with threads: fits the 512 MB plan, and rate-limit counters (kept in this
    # process's memory) stay correct. 90 s because reading a pack photo can take a while.
    startCommand: gunicorn config.wsgi:application --workers 1 --threads 4 --timeout 90 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"  # no paid worker: the same task code runs inline
      - key: EMBEDDINGS_ENABLED
        value: "False"  # the model needs ~320 MB to load; the free plan has 512 MB. Uses pg_trgm.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
