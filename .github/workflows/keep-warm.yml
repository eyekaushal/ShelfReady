name: Keep API warm

# Render's free plan sleeps after 15 idle minutes, and waking takes about a minute.
# /api/health/ doesn't touch the database, so Neon can still sleep and save its free hours.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.RENDER_URL != ''  # set in GitHub → Settings → Secrets and variables → Actions → Variables
    steps:
      - run: curl --fail --silent --show-error --max-time 90 --retry 2 "${{ vars.RENDER_URL }}/api/health/"
