name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # Same image as docker-compose, so tests run against pgvector + pg_trgm.
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shelfready
          POSTGRES_PASSWORD: shelfready
          POSTGRES_DB: shelfready
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shelfready"
          --health-interval 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://shelfready:shelfready@localhost:5432/shelfready
      CELERY_TASK_ALWAYS_EAGER: "True"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Django checks
        run: python manage.py check
      - name: Missing migrations?
        run: python manage.py makemigrations --check --dry-run
      - name: API schema is valid (Swagger)
        run: python manage.py spectacular --validate --fail-on-warn --file /dev/null
      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
