# Local development stack: `docker compose up --build`
#   API     → http://localhost:8000/api/health/
#   DB      → localhost:5432 (user/password/db: shelfready)
#   UI      → http://localhost:5173

services:
  db:
    # Postgres 16 with the pgvector extension pre-installed.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shelfready
      POSTGRES_PASSWORD: shelfready
      POSTGRES_DB: shelfready
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfready"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    # Dev server with auto-reload. Migrations run on every start (safe to repeat).
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: ./backend/.env
    environment:
      # Inside Docker, the DB and Redis are reached by service name, not localhost.
      DATABASE_URL: postgres://shelfready:shelfready@db:5432/shelfready
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
    volumes:
      - ./backend:/app
      - /app/.venv  # don't let the host's macOS venv leak into the Linux container
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    command: celery -A config worker -l info
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://shelfready:shelfready@db:5432/shelfready
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      # The browser calls the API, so this is the host address, not the Docker service name.
      VITE_API_BASE_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules  # keep the container's Linux node_modules, not the host's
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
